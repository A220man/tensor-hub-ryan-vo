name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '24'
  PYTHON_VERSION: '3.12'

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements.txt

      - name: Run tests
        run: |
          .venv/bin/python -m pytest tests -v --tb=short

      - name: Type check (if mypy configured)
        run: |
          .venv/bin/python -c "import backend.app.main; print('Import OK')"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run build

      - name: Run tests
        run: npm test

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: backend/Dockerfile
          push: false
          tags: tensor-hub-backend:test
          load: true

      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: frontend/Dockerfile
          push: false
          tags: tensor-hub-frontend:test
          load: true

      - name: Test backend image
        run: |
          docker run --rm -d --name backend-test -p 8000:8000 tensor-hub-backend:test
          sleep 5
          curl -f http://localhost:8000/api/health
          docker stop backend-test

      - name: Test frontend image
        run: |
          docker run --rm -d --name frontend-test -p 5173:80 tensor-hub-frontend:test
          sleep 3
          curl -f http://localhost:5173/
          docker stop frontend-test

  validate:
    runs-on: ubuntu-latest
    needs: [backend, frontend, docker]
    steps:
      - uses: actions/checkout@v4
      - name: Validate portfolio.json
        run: |
          python3 -c "
import json
with open('portfolio.json') as f:
    data = json.load(f)
assert data['schema_version'] == 1
assert data['name'] == 'tensor-hub-ryan-vo'
assert data['owner'] == 'A220man'
assert data['email'] == 'ryandtvo@gmail.com'
assert len(data['workflows']) >= 3
assert data['auth'] == 'oidc-keycloak-saml-broker'
print('portfolio.json valid')
"
      - name: Check required files
        run: |
          for f in README.md LICENSE CHANGELOG.md pyproject.toml .env.example compose.yaml backend/Dockerfile frontend/Dockerfile frontend/package.json frontend/package-lock.json; do
            test -f "$f" || { echo "Missing: $f"; exit 1; }
          done
          echo "All required files present"